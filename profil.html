<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ForgeX</title>
    <link rel="stylesheet" href="css/profil.css?v=20260326-4">
    <link rel="stylesheet" href="css/style.css?v=20260326-4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<div class="fixed-bg"></div>
<div id="google_translate_element" style="display:none;"></div>

<div class="profile-container">
    <div class="profile-card">
        <a href="index.html" class="vissza-ikon" aria-label="Go to home page"><i class="fa-solid fa-house"></i></a>

        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <h1>My Profile</h1>
            <p>Welcome to your account</p>
        </div>

        <div class="user-details">
            <div class="detail-item">
                <label>Full name</label>
                <div class="detail-value" id="prof-name">Loading...</div>
            </div>

            <div class="detail-item">
                <label>Email address</label>
                <div class="detail-value" id="prof-email">Loading...</div>
            </div>

            <div class="detail-item">
                <label>Phone number</label>
                <div class="detail-value" id="prof-phone">Loading...</div>
            </div>
        </div>

        <div class="bookings-preview">
            <h3>Your Bookings</h3>
            <div id="user-bookings" class="bookings-list">
                <p>You have no active bookings.</p>
            </div>
        </div>

        <button id="logout-btn" class="action-btn">
            Log Out <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
</div>

<script type="module" src="javascript/profil.js?v=20260326-4"></script>
</body>
</html>
