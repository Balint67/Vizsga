<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció | ForgeX</title>
    <link rel="stylesheet" href="css/signIn.css?v=20260326-4">
    <link rel="stylesheet" href="css/style.css?v=20260326-4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="fixed-bg"></div>
<div id="google_translate_element" style="display:none;"></div>

<div class="content">
    <div class="container">
        <!-- Back button to go to sign in page -->
        <a href="signIn.html" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <!-- Header section with avatar and title -->
        <div class="header">
            <div class="avatar">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Regisztráció</h2>
            <p>Hozza létra a fiókját</p>
        </div>

        <!-- Form container -->
        <div class="form-box">
            <div class="tab-buttons">
                <!-- Placeholder for potential tab buttons -->
            </div>

            <!-- Registration form -->
            <form id="regForm">
                <!-- Full name input -->
                <label for="fullname">Teljse név</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="fullname" placeholder="Teljse név" required>
                </div>

                <!-- Email input -->
                <label for="email">Email</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Példa@gmail.com" required>
                </div>

                <!-- Phone input -->
                <label for="phone">Telefonszám</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="06201234567" required>
                </div>

                <!-- Password input with toggle visibility -->
                <label for="password">Jelszó</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Minimum 8 karakter" required minlength="8">
                    <i class="fa-solid fa-eye toggle-password"></i>
                </div>

                <label for="passwordagain">Ismételje meg jelszavát</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordagain">
                    <i class="fa-solid fa-eye toggle-password"></i>
                </div>

                <p id="error-message" style="color: #ff4d4d; font-size: 13px; margin: 5px 0; display: none; font-weight: bold;"></p>
                <p style="font-size: 13px; margin: 8px 0 14px; color: #d7d7d7;">
                    A regisztrációt követően küldünk egy ellenőrző e-mailt a fiók aktiválásához
                </p>

                <button type="submit" class="login-btn">
                    Register <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Link to sign in if user already has an account -->
            <p class="signup-text">
                Már van fiókja? <a href="signIn.html">Jelentkezzen be</a>
            </p>

            <!-- Divider for social login -->
            <div class="divider-signUp">
                <span>vagy</span>
            </div>

            <!-- Social login buttons -->
            <div class="social-buttons">
                <button type="button" id="google-btn">
                    <img src="images/icons/googleLogo.png" alt="google logo" class="googleMiniImg"> Google
                </button>
            </div>
        </div>

        <!-- Footer with terms and privacy links -->
        <p class="footer-text">
            A folytatással elfogadja az
            <a href="contracts.html">Az általános szerződési feltételeket</a>
            és az <a href="contracts.html">Adatvédelmi szabályzatot.</a>
        </p>
    </div>
</div>

<script type="module" src="javascript/signUp.js?v=20260403-3"></script>
    <script type="module" src="javascript/utils.js?v=20260403-3"></script>
</body>
</html>
